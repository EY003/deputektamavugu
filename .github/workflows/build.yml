name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        # Cache the workspace target directory
        workspaces: "."

    - name: Build Release
      run: cargo build --release --workspace

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rust-Visualizer-Windows
        # Uploads the final .exe from the target/release folder
        path: target/release/visualizer-app.exe
        if-no-files-found: error

    - name: Create GitHub Release (Only on Tags)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: target/release/visualizer-app.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Debug - Print visualizer-app manifest
      run: Get-Content visualizer-app/Cargo.toml
      shell: pwsh
    - name: Cache Rust Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "."
        cache-on-failure: true
        # Set to false to bypass the cache for this run
        enable-cache: false
