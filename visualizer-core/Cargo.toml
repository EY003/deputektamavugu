[package]
name = "visualizer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
wasapi = "0.15"
realfft = "3.3"
rustfft = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
image = "0.24"
auto-palette = "0.5"
crossbeam-channel = "0.5"
dirs = "5.0"
toml = "0.8"
arc-swap = "1.7"
spin_sleep = "1.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
