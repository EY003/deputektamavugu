[package]
name = "visualizer-app"
version = "0.1.0"
edition = "2021"

[dependencies]
visualizer-core = { path = "../visualizer-core" }
eframe = "0.27"
egui = "0.27"
tray-icon = "0.11"
global-hotkey = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = "0.24"
crossbeam-channel = "0.5"
glow = "0.13"
arc-swap = "1.7"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
